<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>環保餐具地圖</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <h1>🍱 環保餐具地圖</h1>
    <button type="button" id="add-restaurant-btn" class="btn-primary">新增店家</button>
  </div>

  <!-- 評論表單 modal -->
  <div class="modal" id="review-modal">
    <div class="modal-box">
      <h2 id="review-modal-title">填寫評論</h2>
      <form id="review-form">
        <input type="hidden" name="restaurant_id" />

        <!-- honeypot：一般使用者看不到也不會填，機器人才會填 -->
        <div class="honeypot-field" aria-hidden="true">
          <label>網站 <input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
        </div>

        <fieldset>
          <legend>是否提供環保餐具？</legend>
          <label><input type="radio" name="reusable_tableware" value="yes" required /> 有提供</label>
          <label><input type="radio" name="reusable_tableware" value="no" /> 沒有提供</label>
          <label><input type="radio" name="reusable_tableware" value="unknown" /> 不確定</label>
        </fieldset>

        <fieldset>
          <legend>是否提供環保杯？</legend>
          <label><input type="radio" name="reusable_cup" value="yes" required /> 有提供</label>
          <label><input type="radio" name="reusable_cup" value="no" /> 沒有提供</label>
          <label><input type="radio" name="reusable_cup" value="unknown" /> 不確定</label>
        </fieldset>

        <div class="field-row">
          <label class="field-label" for="review-notes">備註（選填）</label>
          <textarea id="review-notes" name="notes" placeholder="例如：需要主動詢問店員才提供"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>取消</button>
          <button type="submit" class="btn-primary">送出</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 新增餐廳 modal -->
  <div class="modal" id="new-restaurant-modal">
    <div class="modal-box">
      <h2>新增店家</h2>
      <form id="new-restaurant-form">
        <!-- honeypot -->
        <div class="honeypot-field" aria-hidden="true">
          <label>網站 <input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
        </div>

        <div class="field-row">
          <label class="field-label" for="new-restaurant-name">店名</label>
          <input type="text" id="new-restaurant-name" name="name" required />
        </div>

        <div class="field-row">
          <label class="field-label" for="new-restaurant-address">地址（選填）</label>
          <input type="text" id="new-restaurant-address" name="address" />
        </div>

        <fieldset>
          <legend>是否提供環保餐具？</legend>
          <label><input type="radio" name="reusable_tableware" value="yes" required /> 有提供</label>
          <label><input type="radio" name="reusable_tableware" value="no" /> 沒有提供</label>
          <label><input type="radio" name="reusable_tableware" value="unknown" /> 不確定</label>
        </fieldset>

        <fieldset>
          <legend>是否提供環保杯？</legend>
          <label><input type="radio" name="reusable_cup" value="yes" required /> 有提供</label>
          <label><input type="radio" name="reusable_cup" value="no" /> 沒有提供</label>
          <label><input type="radio" name="reusable_cup" value="unknown" /> 不確定</label>
        </fieldset>

        <div class="field-row">
          <label class="field-label" for="new-restaurant-notes">備註（選填）</label>
          <textarea id="new-restaurant-notes" name="notes"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>取消</button>
          <button type="submit" class="btn-primary">送出</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 依相依順序載入：config → db → aggregate → map → ui → app -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/aggregate.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
