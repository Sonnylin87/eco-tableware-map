<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理員後台 - 環保餐具地圖</title>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">
  <div class="admin-page">
    <h1>⚙️ 管理員後台</h1>

    <section id="login-section">
      <form id="login-form">
        <div class="field-row">
          <label class="field-label" for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="username" />
        </div>
        <div class="field-row">
          <label class="field-label" for="login-password">密碼</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="error-text"></p>
        <button type="submit" class="btn-primary">登入</button>
      </form>
    </section>

    <section id="denied-section" class="hidden">
      <p>這個帳號沒有管理員權限。</p>
      <button type="button" id="denied-logout-btn" class="btn-secondary">登出</button>
    </section>

    <section id="dashboard-section" class="hidden">
      <div class="admin-header">
        <a href="index.html" class="btn-secondary">← 回地圖</a>
        <button type="button" id="logout-btn" class="btn-secondary">登出</button>
      </div>

      <div class="admin-tabs">
        <button type="button" class="admin-tab active" id="tab-reports-btn" onclick="switchAdminTab('reports')">待處理回報</button>
        <button type="button" class="admin-tab" id="tab-restaurants-btn" onclick="switchAdminTab('restaurants')">所有店家</button>
      </div>

      <div id="tab-reports">
        <div id="reports-list"></div>
      </div>

      <div id="tab-restaurants" class="hidden">
        <div class="field-row">
          <input type="text" id="restaurant-search-input" placeholder="搜尋店名…" />
        </div>
        <div id="restaurants-list"></div>
      </div>
    </section>
  </div>

  <!-- 編輯店家 modal：改店名/地址，以及底下每一筆評論的勾選內容 -->
  <div class="modal" id="edit-restaurant-modal">
    <div class="modal-box modal-box-wide">
      <h2>編輯店家</h2>
      <form id="edit-restaurant-form">
        <input type="hidden" name="id" />
        <div class="field-row">
          <label class="field-label" for="edit-restaurant-name">店名</label>
          <input type="text" id="edit-restaurant-name" name="name" required />
        </div>
        <div class="field-row">
          <label class="field-label" for="edit-restaurant-address">地址</label>
          <input type="text" id="edit-restaurant-address" name="address" />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="close-edit-restaurant-modal-btn">關閉</button>
          <button type="submit" class="btn-primary">儲存店名/地址</button>
        </div>
      </form>

      <h3>這家店的評論紀錄</h3>
      <div id="edit-restaurant-reviews"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/aggregate.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
