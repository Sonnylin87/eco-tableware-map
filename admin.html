<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理員後台 - 環保餐具地圖</title>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">
  <div class="admin-page">
    <h1>⚙️ 管理員後台</h1>

    <section id="login-section">
      <form id="login-form">
        <div class="field-row">
          <label class="field-label" for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="username" />
        </div>
        <div class="field-row">
          <label class="field-label" for="login-password">密碼</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="error-text"></p>
        <button type="submit" class="btn-primary">登入</button>
      </form>
    </section>

    <section id="denied-section" class="hidden">
      <p>這個帳號沒有管理員權限。</p>
      <button type="button" id="denied-logout-btn" class="btn-secondary">登出</button>
    </section>

    <section id="dashboard-section" class="hidden">
      <div class="admin-header">
        <a href="index.html" class="btn-secondary">← 回地圖</a>
        <button type="button" id="logout-btn" class="btn-secondary">登出</button>
      </div>
      <h2>待處理回報</h2>
      <div id="reports-list"></div>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
